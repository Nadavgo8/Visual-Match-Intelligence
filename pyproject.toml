[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: one rule or component in isolation; no full-match replay",
    "contract: record schemas, versions, links and producer/consumer fixtures",
    "integration: generator, replay, engine, API, WebSocket and agents together",
]

[tool.coverage.run]
branch = true
source = ["vmi"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Error-class rules only (syntax errors, undefined names, invalid comparisons).
# Wider style rules are not adopted yet; new ones are added explicitly, never by blanket ignore.
select = ["E9", "F63", "F7", "F82"]
