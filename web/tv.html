<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%231fa2a8%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VMI · TV view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tv.css">
</head>
<body>
<main class="wrap">
  <div class="stage" id="stage">
    <canvas id="pitch" width="1600" height="900" aria-label="2D replay of a synthetic match"></canvas>

    <div class="overlay" id="overlay">
      <div class="scorebug" id="scorebug">
        <div class="sb-row">
          <span class="sb-team" id="sb-home">HOME</span>
          <span class="sb-score" id="sb-score">0–0</span>
          <span class="sb-team" id="sb-away">AWAY</span>
          <span class="sb-clock" id="sb-clock">0:00</span>
        </div>
        <div class="momentum" title="Momentum, last 7 minutes" aria-label="Momentum">
          <div class="mom-fill" id="mom-fill"></div>
          <div class="mom-mid"></div>
        </div>
        <div class="mom-label" id="mom-label">Momentum: even</div>
      </div>

      <!-- fixed slots: each banner type always appears in the same place -->
      <div class="slot whistle-col">
        <div class="slot-cell" data-slot="whistle-1"></div>
        <div class="slot-cell" data-slot="whistle-2"></div>
        <div class="slot-cell" data-slot="whistle-3"></div>
        <div class="slot-cell" data-slot="whistle-4"></div>
      </div>
      <div class="slot period-slot"><div class="slot-cell" data-slot="period"></div></div>
      <div class="slot crowd-slot"><div class="slot-cell" data-slot="crowd"></div></div>

      <div class="atmo" id="atmo" aria-label="Atmosphere">
        <div class="atmo-meter">
          <i data-l="5"></i><i data-l="4"></i><i data-l="3"></i><i data-l="2"></i><i data-l="1"></i>
        </div>
        <svg class="atmo-wave" id="atmo-wave" viewBox="0 0 40 16" aria-hidden="true"><path id="atmo-path" d="M2 8H38" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <div class="atmo-label" id="atmo-label">Atmosphere unavailable</div>
      </div>
    </div>

    <div class="synthetic">SYNTHETIC MATCH · generated data, not real footage</div>
  </div>

  <section class="controls" aria-label="Replay controls">
    <button id="play" class="primary">▶ Play</button>
    <label>Speed <select id="speed"><option>1</option><option>2</option><option selected>4</option><option>8</option><option>16</option><option>32</option></select>×</label>
    <input id="scrub" type="range" min="0" max="6000" step="1" value="0" aria-label="Match time">
    <span id="time" class="muted">0:00</span>
    <label class="toggle"><input type="checkbox" id="overlay-on" checked> Overlay</label>
    <label class="toggle"><input type="checkbox" id="sound-on"> Synthetic sound</label>
    <div class="chapters" id="chapters"></div>
    <div class="room">
      Companion: <a id="app-link" target="_blank">open on phone</a> · room <b id="room-code"></b>
      · match <input id="seed" type="number" min="1" max="99999" value="12"> <button id="new">Load</button>
      · agents: <span id="agents" class="muted"></span>
    </div>
    <details class="trace" id="trace"><summary>Attention Engine: <span id="trace-sum">waiting</span></summary><ol id="trace-list"></ol></details>
  </section>
</main>
<script type="module" src="/static/tv.js"></script>
</body>
</html>
